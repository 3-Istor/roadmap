name: Deploy to K3s

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: https://roadmap.example.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace if not exists
        run: |
          kubectl create namespace roadmap --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret generic roadmap-secrets \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=notion-api-key="${{ secrets.NOTION_API_KEY }}" \
            --from-literal=notion-members-db-id="${{ secrets.NOTION_MEMBERS_DB_ID }}" \
            --from-literal=notion-projects-db-id="${{ secrets.NOTION_PROJECTS_DB_ID }}" \
            --from-literal=notion-events-db-id="${{ secrets.NOTION_EVENTS_DB_ID }}" \
            --from-literal=notion-tasks-db-id="${{ secrets.NOTION_TASKS_DB_ID }}" \
            --from-literal=webhook-secret="${{ secrets.WEBHOOK_SECRET }}" \
            --from-literal=cron-secret="${{ secrets.CRON_SECRET }}" \
            --namespace=roadmap \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install roadmap-dashboard ./helm \
            --namespace roadmap \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ github.sha }} \
            --set ingress.hosts[0].host=${{ secrets.INGRESS_HOST || 'roadmap.example.com' }} \
            --set ingress.tls[0].hosts[0]=${{ secrets.INGRESS_HOST || 'roadmap.example.com' }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/roadmap-dashboard --namespace=roadmap --timeout=5m
          kubectl get pods --namespace=roadmap -l app.kubernetes.io/name=roadmap-dashboard

      - name: Run database migrations
        run: |
          # Database migrations are now handled by the entrypoint script
          # This step is kept for backwards compatibility but does nothing
          echo "✅ Database migrations are handled automatically by the entrypoint script"
          echo "The app will run 'prisma db push' on startup to ensure schema is synced"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to: ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 Image: ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 URL: https://${{ secrets.INGRESS_HOST || 'roadmap.example.com' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods --namespace=roadmap -l app.kubernetes.io/name=roadmap-dashboard >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
