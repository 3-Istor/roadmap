services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: roadmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadmap-network

  # Roadmap Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roadmap-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://roadmap:roadmap@postgres:5432/roadmap
      
      # Notion API
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_MEMBERS_DB_ID: ${NOTION_MEMBERS_DB_ID}
      NOTION_PROJECTS_DB_ID: ${NOTION_PROJECTS_DB_ID}
      NOTION_EVENTS_DB_ID: ${NOTION_EVENTS_DB_ID}
      NOTION_TASKS_DB_ID: ${NOTION_TASKS_DB_ID}
      
      # Security
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev_webhook_secret_change_in_production}
      CRON_SECRET: ${CRON_SECRET:-dev_cron_secret_change_in_production}
      
      # Next.js
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - roadmap-network

volumes:
  postgres_data:
    driver: local

networks:
  roadmap-network:
    driver: bridge

