# Example Kubernetes Secret for Roadmap Dashboard
# 
# IMPORTANT: This is an example file. DO NOT commit actual secrets to git!
# 
# To create the actual secret:
# 1. Copy this file: cp secrets.example.yaml secrets.yaml
# 2. Replace all placeholder values with your actual credentials
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore

apiVersion: v1
kind: Secret
metadata:
  name: roadmap-secrets
  namespace: default  # Change to your namespace
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgresql://user:password@host:port/database
  database-url: "postgresql://roadmap:CHANGE_ME@postgres:5432/roadmap"
  
  # Notion API Key (get from https://www.notion.so/my-integrations)
  notion-api-key: "ntn_YOUR_NOTION_API_KEY_HERE"
  
  # Notion Database IDs (found in the database URL)
  notion-members-db-id: "YOUR_MEMBERS_DATABASE_ID"
  notion-projects-db-id: "YOUR_PROJECTS_DATABASE_ID"
  notion-events-db-id: "YOUR_EVENTS_DATABASE_ID"
  notion-tasks-db-id: "YOUR_TASKS_DATABASE_ID"
  
  # Webhook secret for Notion webhooks (generate a random string)
  webhook-secret: "GENERATE_RANDOM_STRING_HERE"
  
  # Cron secret for scheduled sync jobs (generate a random string)
  cron-secret: "GENERATE_RANDOM_STRING_HERE"
