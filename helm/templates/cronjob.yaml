{{- if .Values.cronjob.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "roadmap-dashboard.fullname" . }}-sync
  labels:
    {{- include "roadmap-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-cronjob
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "roadmap-dashboard.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: sync-cronjob
        spec:
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          containers:
          - name: sync-trigger
            image: curlimages/curl:latest
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              echo "Triggering Notion sync at $(date)"
              response=$(curl -X POST \
                -H "Content-Type: application/json" \
                -H "x-cron-secret: ${CRON_SECRET}" \
                -w "\n%{http_code}" \
                -s \
                http://{{ include "roadmap-dashboard.fullname" . }}:{{ .Values.service.port }}/api/sync/cron)
              
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              
              echo "Response code: $http_code"
              echo "Response body: $body"
              
              if [ "$http_code" -eq 200 ]; then
                echo "✅ Sync completed successfully"
                exit 0
              else
                echo "❌ Sync failed with code $http_code"
                exit 1
              fi
            env:
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: roadmap-secrets
                  key: cron-secret
            resources:
              {{- toYaml .Values.cronjob.resources | nindent 14 }}
{{- end }}
